<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DailySeed · 375px 验收沙箱</title>
<style>
  html, body { margin: 0; background: #14161a; color: #e8e6e1;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid #2a2e35;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; position: sticky; top: 0;
    background: #14161a; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .hint { color: #8a9099; font-size: 12px; }
  .wrap { display: flex; gap: 22px; padding: 18px; align-items: flex-start; flex-wrap: wrap; }
  .phone { width: 375px; }
  .phone .label { font-size: 12px; color: #8a9099; margin-bottom: 6px; }
  .phone .label b { color: #9fd8a8; font-weight: 600; }
  /* 375 宽的视口，高度贴近 iPhone 的手感 */
  iframe { width: 375px; height: 760px; border: 1px solid #2a2e35; border-radius: 14px;
    background: #fff; display: block; }
</style>
</head>
<body>
<header>
  <h1>DailySeed · 375px 验收沙箱</h1>
  <span class="hint">下面每一栏都是真实的 375px 视口 · 左=开发服务器(5173，无 SW) · 右=预览(4173，有 SW)</span>
</header>
<div class="wrap">
  <div class="phone">
    <div class="label">开发服务器 <b>127.0.0.1:5173</b>（HMR，不注册 SW）</div>
    <iframe src="http://127.0.0.1:5173/" title="dev 375px"></iframe>
  </div>
  <div class="phone">
    <div class="label">预览服务器 <b>127.0.0.1:4173</b>（生产构建，注册 SW）</div>
    <iframe src="http://127.0.0.1:4173/" title="preview 375px"></iframe>
  </div>
</div>
</body>
</html>
