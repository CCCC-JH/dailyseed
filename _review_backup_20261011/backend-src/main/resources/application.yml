spring:
  # 本地凭据从 backend/.env 读（.env 是 properties 格式，且已在 .gitignore 里）
  # 缺这个文件也不影响启动（optional:），只是要用环境变量给 DB_URL/DB_USER/DB_PASSWORD
  config:
    import: optional:file:.env[.properties]
  application:
    name: dailyseed
  datasource:
    # 本地跑：先建库 CREATE DATABASE dailyseed CHARACTER SET utf8mb4，再用环境变量（或 backend/.env）给账号密码
    url: ${DB_URL:jdbc:mysql://localhost:3306/dailyseed?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    # 优雅停机的收尾窗口：给在飞的请求最多 20 秒把话说完（配 server.shutdown=graceful）
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  # 优雅停机：收到 TERM 之后先把在飞的请求做完再退。
  # 这个产品的每一次写请求都可能是一次「留着」——被硬杀在半路上，用户会看到"点了没反应"，
  # 而那种体验对习惯养成产品是致命的（他会以为数据丢了）。
  shutdown: graceful
  tomcat:
    # 别让半开的连接把线程占着；也给反向代理一个统一的超时口径
    connection-timeout: 10s

dailyseed:
  # 开发模式开关。**默认 false**，而且只有它会拦启动：
  #   max-per-day = 0（无限重抽）却没承认开发模式 → 应用起不来（StartupGuard）
  # 这条护栏是为"忘了改配置就上线"准备的，见交接简报 §8。
  # 本地开发请设 DAILYSEED_DEV_MODE=true（本目录的 .env 里已经有一份）
  dev-mode: ${DAILYSEED_DEV_MODE:false}

  draw:
    # 每天最多抽几次（含第一次）。0 = 无限，开发期默认无限，方便连着抽看手感与分布。
    # 生产语义是 1（只能抽一次、没有重抽）；切换不必改代码：
    #   DAILYSEED_DRAW_MAX_PER_DAY=1
    max-per-day: ${DAILYSEED_DRAW_MAX_PER_DAY:0}

  session:
    cookie:
      # 身份自愈：除了 X-Device-Id，再把 userId 种进一个 HttpOnly Cookie。
      # 「清了浏览器缓存」时 localStorage 没了、Cookie 还在，后端仍认得出人。
      # 生产环境是 HTTPS，所以那里请 **打开 secure**：
      #   DAILYSEED_SESSION_COOKIE_SECURE=true
      # 关掉它（=false）就完全退回只管 localStorage，那条退路也就没有了。
      enabled: ${DAILYSEED_SESSION_COOKIE_ENABLED:true}
      secure: ${DAILYSEED_SESSION_COOKIE_SECURE:false}

logging:
  level:
    com.dailyseed: DEBUG
